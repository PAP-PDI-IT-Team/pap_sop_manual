name: PR Checks

on: pull_request

permissions:
  contents: read

jobs:
  lint-and-formatting:
    name: Lint and Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier
        run: npm run format:check

  site-conventions:
    name: Site Conventions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject internal and inline CSS or JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess


          class EmbeddedCodeCheck(HTMLParser):
              def __init__(self, file_path):
                  super().__init__()
                  self.file_path = file_path
                  self.errors = []

              def report(self, message):
                  line, _ = self.getpos()
                  self.errors.append(f"{self.file_path}:{line}: {message}")

              def handle_starttag(self, tag, attributes):
                  attrs = dict(attributes)

                  if tag == "style":
                      self.report("Move <style> content to an external stylesheet.")

                  if tag == "script" and not (attrs.get("src") or "").strip():
                      self.report("Use an external script with a src attribute.")

                  for name in attrs:
                      if name == "style":
                          self.report("Replace the inline style attribute with a CSS class.")
                      elif name.startswith("on"):
                          self.report(f"Move the {name} handler to an external script.")


          files = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.html"], encoding="utf-8"
          )
          errors = []

          for filename in filter(None, files.split("\0")):
              file_path = Path(filename)
              checker = EmbeddedCodeCheck(file_path)
              checker.feed(file_path.read_text(encoding="utf-8"))
              checker.close()
              errors.extend(checker.errors)

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)

          print("No embedded CSS or JavaScript found.")
          PY

      - name: Check required asset folders
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pages_root = Path("pages")
          page_folders = {Path(".")}

          for html_file in pages_root.rglob("*.html"):
              relative_path = html_file.relative_to(pages_root)
              if "assets" not in relative_path.parts[:-1]:
                  page_folders.add(html_file.parent)

          missing = []
          for page_folder in sorted(page_folders):
              for folder_name in ("styles", "script"):
                  folder = page_folder / "assets" / folder_name
                  if not folder.is_dir():
                      missing.append(folder)

          if missing:
              for folder in missing:
                  print(f"Missing required folder: {folder}/")
              raise SystemExit(1)

          print("All required asset folders are present.")
          PY

  changelog:
    name: Check Changelog
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify changelog version and entry
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          latest_release() {
            awk '
              /^##[[:blank:]]+/ {
                if (found) exit
                if ($0 ~ /^## \[(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\]/) {
                  found = 1
                }
              }
              found { print }
            '
          }

          base_changelog=$(git show "${BASE_SHA}:CHANGELOG.md")
          previous_release=$(latest_release <<< "$base_changelog")
          current_release=$(latest_release < CHANGELOG.md)

          previous=$(sed -nE '1s/^## \[([^]]+)\].*/\1/p' <<< "$previous_release")
          current=$(sed -nE '1s/^## \[([^]]+)\].*/\1/p' <<< "$current_release")

          if [[ -z "$current" ]] || ! grep -Eq '^[[:blank:]]*[-*][[:blank:]]+[^[:space:]]' <<< "$current_release"; then
            echo "Add a numbered release heading and a bullet to CHANGELOG.md."
            exit 1
          fi

          if [[ -n "$previous" ]]; then
            highest=$(printf '%s\n' "$previous" "$current" | sort -V | tail -n 1)

            if [[ "$current" == "$previous" || "$current" != "$highest" ]]; then
              echo "The changelog version must be higher than $previous."
              exit 1
            fi
          fi

          echo "Changelog version $current passed."

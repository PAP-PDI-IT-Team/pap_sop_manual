name: PR Checks

on: pull_request

permissions:
    contents: read

jobs:
    quality:
        name: Repository quality
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
                with:
                    fetch-depth: 0
            - uses: actions/setup-node@v4
                    with:
                        node-version: '24'
                        cache: npm
            - run: npm ci

            - name: Check formatting
              run: npm run format:check